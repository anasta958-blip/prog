name: sklad-komforta

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sklad_komforta}
      POSTGRES_USER: ${POSTGRES_USER:-sklad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 хранит кластеры в version-specific подкаталоге этого пути.
      - postgres-data:/var/lib/postgresql
      - ./migrations/public/0001_bootstrap.sql:/docker-entrypoint-initdb.d/0001_bootstrap.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/sklad-komforta &&
      mc anonymous set none local/sklad-komforta
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/backend/SkladKomforta.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-sklad_komforta};Username=${POSTGRES_USER:-sklad};Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      ObjectStorage__ServiceUrl: http://minio:9000
      ObjectStorage__PublicUrl: http://localhost:9000
      ObjectStorage__Region: us-east-1
      ObjectStorage__Bucket: sklad-komforta
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD}
      ObjectStorage__ForcePathStyle: "true"
      Jwt__Issuer: sklad-komforta
      Jwt__Audience: sklad-komforta-clients
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/backend/SkladKomforta.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-sklad_komforta};Username=${POSTGRES_USER:-sklad};Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      ObjectStorage__ServiceUrl: http://minio:9000
      ObjectStorage__PublicUrl: http://localhost:9000
      ObjectStorage__Region: us-east-1
      ObjectStorage__Bucket: sklad-komforta
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD}
      ObjectStorage__ForcePathStyle: "true"
      Jwt__Issuer: sklad-komforta
      Jwt__Audience: sklad-komforta-clients
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
