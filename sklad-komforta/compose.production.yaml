name: sklad-komforta-production

# Production intentionally has no PostgreSQL, Redis, MinIO or Mailpit containers.
# Managed endpoints are supplied through environment variables, so changing a
# provider does not require an application rebuild.
services:
  api:
    build:
      context: .
      dockerfile: src/backend/SkladKomforta.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING}
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:?Set REDIS_CONNECTION_STRING}
      ObjectStorage__ServiceUrl: ${S3_SERVICE_URL:?Set S3_SERVICE_URL}
      ObjectStorage__PublicUrl: ${S3_PUBLIC_URL:?Set S3_PUBLIC_URL}
      ObjectStorage__Region: ${S3_REGION:?Set S3_REGION}
      ObjectStorage__Bucket: ${S3_BUCKET:?Set S3_BUCKET}
      ObjectStorage__AccessKey: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      ObjectStorage__SecretKey: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      ObjectStorage__ForcePathStyle: ${S3_FORCE_PATH_STYLE:-false}
      Jwt__Issuer: ${JWT_ISSUER:?Set JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      Security__TotpEncryptionKey: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY}
      Security__BootstrapToken: ${BOOTSTRAP_TOKEN:?Set BOOTSTRAP_TOKEN}
      Cors__AllowedOrigins__0: https://${APP_DOMAIN:?Set APP_DOMAIN}
      Outbound__AllowPrivateSmtpHosts: ${OUTBOUND_ALLOW_PRIVATE_SMTP_HOSTS:-false}
      ReverseProxy__TrustForwardedHeaders: "true"
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - backend
      - edge

  worker:
    build:
      context: .
      dockerfile: src/backend/SkladKomforta.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      Database__ConnectionString: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING}
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:?Set REDIS_CONNECTION_STRING}
      ObjectStorage__ServiceUrl: ${S3_SERVICE_URL:?Set S3_SERVICE_URL}
      ObjectStorage__PublicUrl: ${S3_PUBLIC_URL:?Set S3_PUBLIC_URL}
      ObjectStorage__Region: ${S3_REGION:?Set S3_REGION}
      ObjectStorage__Bucket: ${S3_BUCKET:?Set S3_BUCKET}
      ObjectStorage__AccessKey: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      ObjectStorage__SecretKey: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      ObjectStorage__ForcePathStyle: ${S3_FORCE_PATH_STYLE:-false}
    restart: unless-stopped
    networks:
      - backend

  web:
    build:
      context: src/flutter
      dockerfile: Dockerfile.web
      args:
        API_BASE_URL: /api/v1
        APP_ENVIRONMENT: production
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      # Prevent the official Nginx entrypoint from replacing $host, $uri and
      # other native Nginx variables while rendering the config template.
      NGINX_ENVSUBST_FILTER: ^APP_DOMAIN$
    volumes:
      - ${TLS_CERTIFICATE_PATH:?Set TLS_CERTIFICATE_PATH}:/etc/nginx/certs/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_PATH:?Set TLS_PRIVATE_KEY_PATH}:/etc/nginx/certs/privkey.pem:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - edge

networks:
  backend:
    internal: true
  edge:
